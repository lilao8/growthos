# The six checks CLAUDE.md specifies, on every push and pull request.
#
# Split in two jobs because the costs differ by two orders of magnitude. The
# fast four finish in about six seconds, so they run on both supported Node
# versions. The e2e suite takes ~1.2m across three browser engines and needs
# a production build first, so it runs once.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: lint, typecheck, unit, integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json's engines field, and 24 is
        # what development and the Vercel runtime actually use. Testing only
        # one of them would leave the other a claim rather than a fact.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci rather than install: the point is to verify the lockfile resolves
      # in a clean environment, which is what CLAUDE.md asks of this command.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run test:integration -- --run

  e2e:
    name: e2e (3 engines) and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The browser download is far slower than the suite itself, so it is
      # keyed on the Playwright version and reused until that changes.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # A cache hit restores the browsers but not the system libraries they
      # link against, which live outside the cached directory.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # playwright.config.ts builds and starts the app itself, and already
      # reads CI to forbid .only, retry once and switch reporters.
      - run: npm run test:e2e

      # Separate from the e2e build: this one runs without the e2e storage
      # namespace, which is inlined at build time for NEXT_PUBLIC_* values.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
