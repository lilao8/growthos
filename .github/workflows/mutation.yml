# Mutation testing over src/domain, on demand.
#
# Separate from ci.yml because of cost, not importance: a full run is ~24
# minutes, since every one of ~4100 mutants runs the whole unit suite (the
# command runner has no per-test coverage map; see stryker.config.mjs for why
# the vitest runner cannot be used). That is too slow to sit on every push.
#
# Run it from the Actions tab before merging anything that changes domain
# logic or its tests. The command fails below the floor set in
# stryker.config.mjs, so a run that goes green has not regressed.
name: Mutation

on:
  workflow_dispatch:

jobs:
  mutation:
    name: mutation testing (src/domain)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run test:mutation

      # The HTML report lists every surviving mutant with its diff, which is
      # the useful output; the score alone says only how many there are.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
